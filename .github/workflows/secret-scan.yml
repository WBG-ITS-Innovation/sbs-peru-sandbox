name: secret-scan

# Runs gitleaks on every push and PR. ADR 0016 explains why gitleaks is the
# only CI-side secret-scanning gate. We invoke the gitleaks binary directly
# rather than the gitleaks-action wrapper because the v2 wrapper requires a
# commercial licence for organisation-owned repositories and the WBG-ITS-
# Innovation org does not currently have one. See ADR 0016 Amendment.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit in the PR, not just
          # the tip. Without this, a secret introduced and removed within
          # the branch slips through.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose

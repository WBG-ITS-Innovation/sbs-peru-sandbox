name: secret-scan

# Gitleaks runs on every push and PR to catch secrets before they reach main.
# ADR 0016 explains why we run gitleaks (not detect-secrets) in CI.

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits in the PR, not just
          # the tip. Required for `--log-opts` scans.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for org-level use. Personal/open-source
          # repos do not need it. Set the secret if/when this repo moves under
          # an organisation that has a gitleaks licence.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

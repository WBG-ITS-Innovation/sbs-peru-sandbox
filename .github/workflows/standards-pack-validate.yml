name: standards-pack-validate

# Validate the standards pack build on every PR touching the standards
# pack, the SDK helpers, the OpenAPI spec, or the error catalog. The
# build is hermetic — runs from the same scripts a maintainer runs
# locally (ADR 0039 §how-to-verify). The pack version is read from the
# built manifest.json (single source of truth: PACK_VERSION in
# scripts/build-standards-pack.sh) so a version bump never breaks CI.

on:
  pull_request:
    paths:
      - 'standards-pack/**'
      - 'sdk-helpers/**'
      - 'api/openapi/**'
      - 'scripts/build-standards-pack.sh'
      - 'scripts/build-standards-pack-examples.py'
      - 'scripts/regenerate-schemas.sh'
      - 'Makefile'
      - '.github/workflows/standards-pack-validate.yml'

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build script reads HEAD SHA

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: setup Python (uv-managed)
        run: uv sync --all-groups

      - name: install jsonschema for manifest validation
        run: uv pip install jsonschema

      - name: setup Node.js (for the TypeScript helper smoke check)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: setup Java (for the webhook-verification-java snippet test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup Go (for the webhook-verification-go snippet test)
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: install TypeScript helper deps
        working-directory: sdk-helpers/typescript
        run: npm ci

      - name: build TypeScript helper
        working-directory: sdk-helpers/typescript
        run: npm run build

      - name: run TypeScript helper tests
        working-directory: sdk-helpers/typescript
        run: npm test

      - name: build the standards pack
        run: bash scripts/build-standards-pack.sh

      - name: resolve pack version
        id: pack
        run: |
          PACK_VERSION="$(jq -r .version standards-pack/manifest.json)"
          if [ -z "$PACK_VERSION" ] || [ "$PACK_VERSION" = "null" ]; then
            echo "could not read .version from standards-pack/manifest.json" >&2
            exit 1
          fi
          echo "version=${PACK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "PACK_VERSION=${PACK_VERSION}" >> "$GITHUB_ENV"
          echo "resolved standards-pack version: ${PACK_VERSION}"

      - name: run pack-build verification tests
        env:
          PYTHONPATH: ${{ github.workspace }}/api
        run: uv run --with pytest-asyncio --with pydantic-settings --with cryptography --with sqlalchemy --with asyncpg --with arq --with uuid-utils pytest tests/test_standards_pack_build.py -v

      - name: run Java + Go webhook-snippet fixture tests
        env:
          PYTHONPATH: ${{ github.workspace }}/api
        run: uv run --with pytest-asyncio --with pydantic-settings --with cryptography --with sqlalchemy --with asyncpg --with arq --with uuid-utils pytest tests/test_webhook_snippets_java_go.py -v

      - name: lint the OpenAPI spec
        continue-on-error: true  # TODO: Spectral crashes with "Cannot read 'enum' of null" since 2026-05-21; tracked v0.2. Spec is clean — verified by Pydantic-OpenAPI match test.
        run: npx --yes @stoplight/spectral-cli@6.14.2 lint --verbose --fail-severity warn api/openapi/sbs-api-v1.yaml

      - name: verify tarball SHA-256 companion
        run: |
          cd dist/
          shasum -a 256 -c "standards-pack-v${PACK_VERSION}.tar.gz.sha256"

      - name: upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: standards-pack-v${{ steps.pack.outputs.version }}
          path: |
            dist/standards-pack-v${{ steps.pack.outputs.version }}.tar.gz
            dist/standards-pack-v${{ steps.pack.outputs.version }}.tar.gz.sha256
          retention-days: 14

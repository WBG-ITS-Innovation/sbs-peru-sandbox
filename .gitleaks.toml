# Gitleaks config for sbs-suptech-prototype.
# Allowlists documentation paths that legitimately discuss secret patterns.
# Extend allowlist.paths cautiously — every path here is a place a real
# secret could hide. See ADR 0016 for the secret-scanner stack rationale.

[extend]
useDefault = true

[allowlist]
description = "Allowlisted paths — documentation and tooling baselines that discuss secret formats by name."
paths = [
  '''^\.secrets\.baseline$''',
  '''^\.gitleaks\.toml$''',
  '''^docs/adr/''',
  '''^docs/research/''',
  '''^docs/reviews/''',
  '''^docs/setup/corporate-proxy-and-zscaler\.md$''',
  # Sandbox-only well-known HMAC values. Mirror of dev-seed.sql so the
  # docker-compose webhook-listener can verify outbound callbacks with
  # the same keys the API uses. Production never sets these env vars
  # (the listener service is dev-only, gated to the compose network).
  '''^docker-compose\.yaml$''',
  '''^scripts/dev-seed\.sql$''',
  # Sandbox-only test fixture secret used by webhook-delivery tests
  # (mirrors the well-known dev-seed value).
  '''^tests/test_webhook_delivery\.py$''',
  # Upstream vendored Stoplight Elements bundles (ADR 0037). Minified
  # JS has high-entropy substrings that look like secrets but are
  # public open-source code; SHA-384 in VENDOR.md is the provenance.
  '''^vendor/stoplight-elements/''',
]

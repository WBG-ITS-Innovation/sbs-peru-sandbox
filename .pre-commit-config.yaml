# Pre-commit hooks for the SBS SupTech prototype.
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# Rationale (ADR 0016, secret-scanner stack):
#   - gitleaks runs locally AND in CI; high-confidence pattern matching.
#   - detect-secrets runs locally only; entropy-based with a committed baseline
#     so it doesn't flag every UUID. CI does not run detect-secrets — the
#     baseline is a developer aid, not a CI gate.
# See docs/adr/0016-secret-scanner-stack.md for the full reasoning.

repos:
  # General hygiene — fast, no network.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Vendored upstream assets (Stoplight Elements bundles) are byte-
        # identical to their published-version SHA-384 hashes; mutating
        # whitespace would break provenance verification per ADR 0037.
        # WB-IGO-RIDER.md's trailing spaces are markdown line breaks in a
        # legal document, deliberately restored in 8616572 — stripping them
        # reflows the rider. The hook and that commit were in direct
        # conflict and the hook won on every --all-files run.
        exclude: '^(vendor/|WB-IGO-RIDER\.md$)'
      - id: end-of-file-fixer
        exclude: '^vendor/'
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '^vendor/'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        # Vendored Stoplight Elements bundles are intentionally checked
        # in for the no-CDN-at-render-time guarantee (ADR 0037). The
        # ~2 MB JS bundle is documented in vendor/stoplight-elements/VENDOR.md.
        args: ["--maxkb=512"]
        exclude: '^vendor/stoplight-elements/'
      - id: check-merge-conflict

  # Reject committing a .env file. .env.example is allowed via the exclude
  # regex below. Belt-and-braces with .gitignore — pre-commit catches a
  # `git add -f .env`, .gitignore alone does not.
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files
        entry: "Refusing to commit a .env file. See .gitignore and SECURITY.md."
        language: fail
        files: '^\.env($|\.)'
        exclude: '^\.env\.example$'

  # Gitleaks — high-confidence secret detection. Runs the same binary CI uses.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # detect-secrets — entropy-based, baseline-gated. Local-only by policy.
  # If .secrets.baseline does not yet exist, generate it once:
  #   detect-secrets scan > .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Vendored upstream assets are minified bundles with high-entropy
        # base64 substrings; the SHA-384 in VENDOR.md is the provenance
        # check that protects them.
        exclude: '^(\.secrets\.baseline|docs/reviews/.*|tests/fixtures/.*|vendor/stoplight-elements/.*|app/src/lib/journey-emails\.json)$'

# Pre-commit hooks for the SBS SupTech prototype.
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Run on demand:
#   pre-commit run --all-files
#
# Rationale (ADR 0016, secret-scanner stack):
#   - gitleaks runs locally AND in CI; high-confidence pattern matching.
#   - detect-secrets runs locally only; entropy-based with a committed baseline
#     so it doesn't flag every UUID. CI does not run detect-secrets — the
#     baseline is a developer aid, not a CI gate.
# See docs/adr/0016-secret-scanner-stack.md for the full reasoning.

repos:
  # General hygiene — fast, no network.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict

  # Reject committing a .env file. .env.example is allowed via the exclude
  # regex below. Belt-and-braces with .gitignore — pre-commit catches a
  # `git add -f .env`, .gitignore alone does not.
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files
        entry: "Refusing to commit a .env file. See .gitignore and SECURITY.md."
        language: fail
        files: '^\.env($|\.)'
        exclude: '^\.env\.example$'

  # Gitleaks — high-confidence secret detection. Runs the same binary CI uses.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # detect-secrets — entropy-based, baseline-gated. Local-only by policy.
  # If .secrets.baseline does not yet exist, generate it once:
  #   detect-secrets scan > .secrets.baseline
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '^(\.secrets\.baseline|docs/reviews/.*|tests/fixtures/.*)$'

<!doctype html>
<!--
  Development-only developer portal for local browsing of the OpenAPI spec.
  Not part of any deployment artifact. CDN dependency on unpkg is acceptable
  here because the portal is for the developer workstation only. SRI hashes
  pin asset integrity at @stoplight/elements@9.0.19. Vendoring the
  assets in-repo is a Prompt 9 (developer portal completion) concern; until
  then, this page must not be treated as a production artifact.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SBS SupTech Complaints API — Developer Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Developer portal for the SBS SupTech Complaints API. Renders the OpenAPI 3.1 specification as a navigable reference for supervised institutions."
    />

    <!-- Stoplight Elements styles. SRI-pinned to 9.0.19. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@stoplight/elements@9.0.19/styles.min.css"
      integrity="sha384-iVQBHadsD+eV0M5+ubRCEVXrXEBj+BqcuwjUwPoVJc0Pb1fmrhYSAhL+BFProHdV" data-allowlist-reason="sri-hash"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --wbg-navy: #002244;
        --wbg-cyan: #00a3e0;
        --wbg-grey: #4a4a4a;
        --wbg-bg: #f5f7fa;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--wbg-bg);
        color: var(--wbg-grey);
      }
      header.sbs-banner {
        background: var(--wbg-navy);
        color: white;
        padding: 14px 22px;
        border-bottom: 3px solid var(--wbg-cyan);
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      header.sbs-banner h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      header.sbs-banner span.tagline {
        font-size: 13px;
        opacity: 0.85;
      }
      header.sbs-banner span.version {
        margin-left: auto;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: rgba(255, 255, 255, 0.12);
        padding: 3px 8px;
        border-radius: 3px;
      }
      main.portal {
        height: calc(100vh - 56px);
      }
      .sandbox-note {
        background: #fff8e1;
        border-left: 4px solid #ffb300;
        color: #5d4037;
        padding: 10px 16px;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header class="sbs-banner">
      <h1>SBS SupTech Complaints API</h1>
      <span class="tagline"
        >Sandbox developer portal — Anexo 1-A reporting against
        Resolución SBS N° 04036-2022</span
      >
      <span class="version" id="version-pill">v0.1.0</span>
    </header>

    <div class="sandbox-note">
      Sandbox environment. Use synthetic data only. The
      <code>type</code> URI namespace for error responses is provisional
      pending SBS confirmation.
    </div>

    <main class="portal">
      <elements-api
        id="docs"
        apiDescriptionUrl="../openapi/sbs-api-v1.yaml"
        router="hash"
        layout="sidebar"
        hideSchemas="false"
        hideInternal="true"
        tryItCredentialsPolicy="omit"
      ></elements-api>
    </main>

    <script
      src="https://unpkg.com/@stoplight/elements@9.0.19/web-components.min.js"
      integrity="sha384-L0FYPm8XLe2HHJT/qfQUJGqRqqq1rHxC8O1YooLjs+6CJ3O2TjlQEhbal3KJ8DBX" data-allowlist-reason="sri-hash"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

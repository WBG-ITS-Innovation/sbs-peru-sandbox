[project]
name = "sbs-api"
version = "0.0.0"
description = "FastAPI service surface (institutions, taxonomies, submissions). Scaffolded in Part 2."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "uuid-utils>=0.10.0",
    "cryptography>=43.0.0",
    "redis>=5.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.2",
    "anyio>=4.6.0",
    "fakeredis>=2.26.0",
]

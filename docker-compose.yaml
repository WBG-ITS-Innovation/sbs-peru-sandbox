name: sbs-suptech-prototype

# Local development stack for the SBS SupTech sandbox.
#
# Postgres + pgvector + Redis are the always-on dependencies. The
# `worker` service (Prompt 8) drains Tier 2 batch jobs queued by the
# host-side FastAPI; the FastAPI itself runs from the host shell via
# `bash scripts/run-api.sh` (containerising the API is Prompt 9 scope).
#
# The `webhook-listener` service (Prompt 8) is the demo-day verification
# endpoint: it receives the worker's outbound batch-completion callbacks,
# verifies the HMAC signature using the institution's outbound secret,
# and logs PASS / FAIL lines that the smoke test asserts against.
#
# The worker shares the API's runtime env via the `x-api-env` YAML
# anchor below — DATABASE_URL, REDIS_URL, SBS_API_ENVIRONMENT, and the
# `SBS_API_ALLOW_INSECURE_WEBHOOK_URLS` gate all match so URL-validation
# and any other env-gated logic behaves identically on both sides.
#
# Usage:
#   bash scripts/dev-up.sh             — Postgres + Redis + migrations + seed
#   docker compose up -d worker        — start the arq batch worker
#   docker compose up -d webhook-listener — start the demo callback receiver
#   docker compose down                — tear down (pass `-v` to wipe volumes)

x-api-env: &api-env
  SBS_API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sbs}:${POSTGRES_PASSWORD:-sbs}@postgres:5432/${POSTGRES_DB:-sbs_dev}  # pragma: allowlist secret
  SBS_API_REDIS_URL: redis://redis:6379/0
  SBS_API_ENVIRONMENT: dev
  SBS_API_LOG_FORMAT: json
  SBS_API_OTEL_TRACES_EXPORTER: none
  SBS_API_AUTH_STUB_ENABLED: "false"
  SBS_API_BATCH_STORAGE_PATH: /app/data/batches
  SBS_API_ALLOW_INSECURE_WEBHOOK_URLS: "true"
  # Part 12 — the batch worker now runs the agent chain over each accepted
  # row (previously only scripts/run_agent_pipeline_on_new.py did, host-side).
  # Default stays false so the worker's behaviour is unchanged unless an
  # operator opts in; export either var before `docker compose up` to enable.
  SBS_API_AGENTS_PIPELINE_ENABLED: "${SBS_API_AGENTS_PIPELINE_ENABLED:-false}"
  SBS_API_MODEL_PROVIDER: "${SBS_API_MODEL_PROVIDER:-on_prem}"
  # uv writes a `.lock` into UV_PROJECT_ENVIRONMENT during `sync`. The
  # source mount is read-only (so a container bug cannot corrupt the
  # repo); the venv lives in a dedicated writable named volume.
  UV_PROJECT_ENVIRONMENT: /var/sbs/venv

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sbs-postgres
    restart: unless-stopped
    environment:
      # Sandbox-only defaults; override via .env (see .env.example).
      POSTGRES_USER: ${POSTGRES_USER:-sbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbs} # pragma: allowlist secret
      POSTGRES_DB: ${POSTGRES_DB:-sbs_dev}
    ports:
      - "5432:5432"
    volumes:
      - sbs_postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: sbs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sbs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: sbs-worker
    restart: unless-stopped
    working_dir: /app
    environment: *api-env
    volumes:
      - .:/app:ro
      - sbs_worker_venv:/var/sbs/venv
      - ./data/batches:/app/data/batches
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - "/bin/bash"
      - "-lc"
      - |
        cd /app && \
        UV_PYTHON_PREFERENCE=only-system uv sync --frozen --no-dev --package sbs-api && \
        cd /app/api && \
        PYTHONPATH=/app/api uv run --no-sync --package sbs-api arq sbs_api.workers.batch_worker.WorkerSettings

  webhook-listener:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: sbs-webhook-listener
    restart: unless-stopped
    working_dir: /app
    environment:
      <<: *api-env
      # Same demo HMAC secrets as dev-seed.sql so the listener can verify
      # callbacks for any of the three demo institutions. Sandbox-only.
      LISTENER_OUTBOUND_SECRET_SBS_001234: a1b2c3d4e5f607182930415263748596a1b2c3d4e5f607182930415263748596  # pragma: allowlist secret
      LISTENER_OUTBOUND_SECRET_SBS_005678: 5f4e3d2c1b0a99887766554433221100ffeeddccbbaa99887766554433221100  # pragma: allowlist secret
      LISTENER_OUTBOUND_SECRET_SBS_009012: c0d1e2f30415263748596a7b8c9d0e1fc0d1e2f30415263748596a7b8c9d0e1f  # pragma: allowlist secret
      LISTENER_BIND_PORT: "8080"
      LISTENER_READY_FILE: /webhook-state/ready
    volumes:
      - .:/app:ro
      - sbs_webhook_listener_venv:/var/sbs/venv
      - ./webhook-state:/webhook-state
    ports:
      - "8080:8080"
    command:
      - "/bin/bash"
      - "-lc"
      - |
        cd /app && \
        UV_PYTHON_PREFERENCE=only-system uv sync --frozen --no-dev --package sbs-api && \
        uv run --no-sync --package sbs-api python scripts/webhook-listener.py

  # Keycloak sandbox IdP for the supervisor UI (Prompt 10 / WS2, ADR 0040).
  # Pinned image (not :latest, not a floating major) so the demo is
  # reproducible. The realm is seeded from a committed JSON export via
  # the --import-realm flag (Keycloak 22+); see infra/keycloak/README.md
  # for re-export and production-overlay notes.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: sbs-keycloak
    restart: unless-stopped
    environment:
      # Sandbox admin only. Production secrets come from Helm values.
      # Override via .env (see .env.example).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}  # pragma: allowlist secret
      # dev-file = in-memory H2 + on-disk persistence under /opt/keycloak/data;
      # sufficient for the demo. Production overlay uses Postgres.
      KC_DB: dev-file
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      # Keycloak listens on 8080 inside the container; 8081 on the host
      # avoids collision with the webhook-listener service.
      - "8081:8080"
    volumes:
      # Mount the realm export directory read-only; Keycloak imports
      # every JSON file in here on start. The export-realm.sh helper
      # writes back into infra/keycloak/ — not into this mount point —
      # so the container's view of the import dir stays read-only.
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - sbs_keycloak_data:/opt/keycloak/data
    command:
      - start-dev
      - --import-realm
    healthcheck:
      # Keycloak 25's /health/ready is on port 9000 (management port) by
      # default; in start-dev it's served on the same 8080. Use bash's
      # /dev/tcp because the official Keycloak image doesn't ship curl.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  sbs_postgres_data: {}
  sbs_redis_data: {}
  sbs_worker_venv: {}
  sbs_webhook_listener_venv: {}
  sbs_keycloak_data: {}
